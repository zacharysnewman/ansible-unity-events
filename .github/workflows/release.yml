name: Release (Unity)
on:
  push:
    branches:
      - main
    # Scoped so commits that only touch the TypeScript package in web~/ do not
    # cut a Unity release. The web package has its own pipeline in
    # release-web.yml.
    paths:
      - 'Runtime/**'
      - 'package.json'
      - 'README.md'
      - 'LICENSE.md'
      - '.releaserc.json'
      - '.github/workflows/release.yml'
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
