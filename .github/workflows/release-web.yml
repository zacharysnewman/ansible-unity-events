name: Release (web)
on:
  push:
    branches:
      - main
    paths:
      - 'web~/**'
      - '.github/workflows/release-web.yml'
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: 'web~/package-lock.json'
      - name: Install and verify
        working-directory: 'web~'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      # Run semantic-release from web~ so its own .releaserc.json is the
      # nearest config found. Running it at the repo root would pick up the
      # Unity .releaserc.json instead. Plugins not bundled with
      # semantic-release are supplied via -p.
      - name: Release
        working-directory: 'web~'
        run: |
          npx -y \
            -p semantic-release@24 \
            -p @semantic-release/changelog@6 \
            -p @semantic-release/git@10 \
            semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required to publish. Without it this job fails at verifyConditions.
          # Add under Settings -> Secrets and variables -> Actions.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
