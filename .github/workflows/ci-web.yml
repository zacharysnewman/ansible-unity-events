name: CI (web)
on:
  push:
    branches:
      - main
    paths:
      - 'web~/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'web~/**'
      - '.github/workflows/ci-web.yml'
jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        # Unity's asset importer ignores folders ending in `~`, which is why
        # the TypeScript package lives here.
        working-directory: 'web~'
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: 'web~/package-lock.json'
      - run: npm ci
      # Also asserts the compile-time inference cases in test/types.test-d.ts.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
